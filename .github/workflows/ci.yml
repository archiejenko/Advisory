name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build the website
        run: npm --prefix apps/web ci && npm run web:build
      - name: End-to-end (mocks, local Worker, every API flow)
        run: node scripts/dev-secrets.mjs && npm run test:e2e
